/* ============================================================
   1. SEEDED RNG — pure JS (no external deps)
   ============================================================ */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(value, min, max) {
  if (min === undefined) min = 0;
  if (max === undefined) max = 100;
  if (Number.isNaN(value)) return min;
  return Math.min(max, Math.max(min, value));
}
function createRNG(seed) {
  const seedStr = String(seed);
  const seedFn = xmur3(seedStr);
  const rand = mulberry32(seedFn());
  const random = () => rand();
  const randomInt = (min, max) => {
    if (max < min) { const t = min; min = max; max = t; }
    return Math.floor(random() * (max - min + 1)) + min;
  };
  const randomChoice = (arr) => arr[randomInt(0, arr.length - 1)];
  const weightedChoice = (items, weights) => {
    const total = weights.reduce((a, b) => a + Math.max(b, 0), 0);
    if (total <= 0) return randomChoice(items);
    let r = random() * total;
    for (let i = 0; i < items.length; i++) {
      r -= Math.max(weights[i], 0);
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  };
  const probability = (p) => random() < p;
  const normal = (m, s) => {
    if (m === undefined) m = 0;
    if (s === undefined) s = 1;
    let u = 0, v = 0;
    while (u === 0) u = random();
    while (v === 0) v = random();
    const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    return z * s + m;
  };
  const fork = (label) => createRNG(seedStr + '::' + label);
  return { random, randomInt, randomChoice, weightedChoice, probability, normal, fork, seed: seedStr };
}

/* ============================================================
   2. STATISTICS — mean/variance/correlation/OLS/t-distribution
   ============================================================ */
function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }
function sampleVariance(arr) {
  const m = mean(arr);
  return arr.reduce((s, x) => s + (x - m) * (x - m), 0) / (arr.length - 1);
}
function percentileRank(arr) {
  const sorted = arr.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
  const out = new Array(arr.length);
  sorted.forEach(([, originalIdx], rank) => {
    out[originalIdx] = arr.length <= 1 ? 50 : (rank / (arr.length - 1)) * 100;
  });
  return out;
}
function correlation(x, y) {
  const mx = mean(x), my = mean(y);
  let num = 0, dx = 0, dy = 0;
  for (let i = 0; i < x.length; i++) {
    num += (x[i] - mx) * (y[i] - my);
    dx += (x[i] - mx) ** 2;
    dy += (y[i] - my) ** 2;
  }
  return num / Math.sqrt(dx * dy);
}
function gammaln(xx) {
  const cof = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let x = xx, y = xx;
  let tmp = x + 5.5;
  tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015;
  for (let j = 0; j < 6; j++) { y += 1; ser += cof[j] / y; }
  return -tmp + Math.log((2.5066282746310005 * ser) / x);
}
function betacf(a, b, x) {
  const MAXIT = 100, EPS = 3e-7, FPMIN = 1e-30;
  const qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - (qab * x) / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m;
    let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; h *= d * c;
    aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d;
    const del = d * c; h *= del;
    if (Math.abs(del - 1) < EPS) break;

function betai(a, b, x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(gammaln(a + b) - gammaln(a) - gammaln(b) + a * Math.log(x) + b * Math.log(1 - x));
  if (x < (a + 1) / (a + b + 2)) return (bt * betacf(a, b, x)) / a;
  return 1 - (bt * betacf(b, a, 1 - x)) / b;

function studentTCDF(t, df) {
  const x = df / (df + t * t);
  const p = betai(df / 2, 0.5, x);
  return t >= 0 ? 1 - p / 2 : p / 2;
}
function studentTInv(p, df) {
  let lo = -60, hi = 60;
  for (let i = 0; i < 70; i++) {
    const mid = (lo + hi) / 2;
    if (studentTCDF(mid, df) < p) lo = mid; else hi = mid;

function transpose(m) { return m[0].map((_, c) => m.map((row) => row[c])); }
function matMul(a, b) {
  const result = [];
  for (let i = 0; i < a.length; i++) {
    result.push([]);
    for (let j = 0; j < b[0].length; j++) {
      let sum = 0;
      for (let k = 0; k < b.length; k++) sum += a[i][k] * b[k][j];
      result[i].push(sum);
    }
  }
  return result;
}
function invert(matrix) {
  const n = matrix.length;
  const aug = matrix.map((row, i) => [...row, ...Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))]);
  for (let col = 0; col < n; col++) {
    let pivotRow = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(aug[r][col]) > Math.abs(aug[pivotRow][col])) pivotRow = r;
    const tmpRow = aug[col]; aug[col] = aug[pivotRow]; aug[pivotRow] = tmpRow;
    if (Math.abs(aug[col][col]) < 1e-12) aug[col][col] += 1e-8;
    const pivotVal = aug[col][col];
    for (let j = 0; j < 2 * n; j++) aug[col][j] /= pivotVal;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = aug[r][col];
      for (let j = 0; j < 2 * n; j++) aug[r][j] -= factor * aug[col][j];
    }
  }
  return aug.map((row) => row.slice(n));
}
function multipleLinearRegression(X, y) {
  const n = X.length, k = X[0].length;
  const design = X.map((row) => [1, ...row]);
  const designT = transpose(design);
  const XtX = matMul(designT, design);
  const XtXInv = invert(XtX);
  const XtY = matMul(designT, y.map((v) => [v]));
  const betaM = matMul(XtXInv, XtY);
  const beta = betaM.map((r) => r[0]);
  const intercept = beta[0];
  const predictions = design.map((row) => row.reduce((s, v, i) => s + v * beta[i], 0));
  const residuals = y.map((yi, i) => yi - predictions[i]);
  const ssRes = residuals.reduce((s, r) => s + r * r, 0);
  const yMean = mean(y);
  const ssTot = y.reduce((s, yi) => s + (yi - yMean) ** 2, 0);
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  const dof = Math.max(n - k - 1, 1);
  const sigma2 = ssRes / dof;
  const cov = XtXInv.map((row) => row.map((v) => v * sigma2));
  const seAll = cov.map((row, i) => Math.sqrt(Math.max(row[i], 0)));
  const tAll = beta.map((b, i) => b / (seAll[i] || 1e-9));

    intercept,
    coefficients: beta.slice(1),
    standardErrors: seAll.slice(1),
    tStats: tAll.slice(1),
    pValues: pAll.slice(1),

function simulateMultipleTests(labels, alpha, randomFn) {
  return labels.map((label) => {
    const pValue = Math.round(randomFn() * 1000) / 1000;
    return { label, pValue, significant: pValue < alpha };

/* ============================================================
   3. GAME CONFIG — life stages, balance, presets, reference data
   ============================================================ */
const LIFE_STAGES = ['birth', 'toddler', 'elementary', 'middleSchool', 'highSchool', 'collegeOrWork', 'earlyCareer', 'youngAdultCareer', 'midlife', 'careerTurning', 'lateLife', 'retirement'];
const LIFE_STAGE_LABELS = { birth: '出生', toddler: '幼兒期', elementary: '國小', middleSchool: '國中', highSchool: '高中', collegeOrWork: '大學／技職／就業', earlyCareer: '初入職場', youngAdultCareer: '青年職涯', midlife: '中年', careerTurning: '職涯轉折', lateLife: '晚年', retirement: '退休' };
const LIFE_STAGE_START_AGE = { birth: 0, toddler: 3, elementary: 7, middleSchool: 13, highSchool: 16, collegeOrWork: 19, earlyCareer: 23, youngAdultCareer: 27, midlife: 40, careerTurning: 48, lateLife: 58, retirement: 65 };

const DEFAULT_SETTINGS = {
  npcSampleSize: 999, alphaThreshold: 0.05,
  /* 統計實驗室：成功／努力的操作化方式。預設值與原本的行為完全一致。 */

  luckCoefficient: 0.08, randomNoise: 0.12,
  /* 機會集合 Opportunity Set：0 = 機會分配極不平等（資源不夠的人，某些選項從一開始

  /* 社會安全網 Social Safety Net：0 = 幾乎沒有社會安全網（風雨全部由個人與家庭承擔，

     不影響正面效果，也不影響其他類型的風險。 */

  /* 起始不平等 Starting Inequality：0 = 家庭背景幾乎人人相同（起跑點壓縮），

  /* 資源轉換 Resource Conversion：0 = 該類資本幾乎換不到對應資源，100 = 該類資本

  /* 抉擇強度 Trade-off Strength：數值愈高，代表「魚與熊掌不可兼得」的抉擇後座力愈強

const EVENTS_PER_STAGE = 2;

  for (const stage of LIFE_STAGES) {
    player = { ...player, stage, age: LIFE_STAGE_START_AGE[stage] };
    for (let i = 0; i < EVENTS_PER_STAGE; i++) {
      const event = pickStageEvent(pool, stage, i, player, eventsRng, usedEventIds, settings.enableTimeRelevantEvents, settings);

        const result = applyChoice(player, event, choice, eventsRng, settings);
        player = result.player;

        return { player, nextEvent: { ...event, choices: unlockedChoices }, done: false };

  const perStage = eventsPerStage || EVENTS_PER_STAGE;
  let player = createPlayer(seed, !!isNPC, settings);
  const eventsRng = createRNG(seed + '::events');
  const usedEventIds = new Set();
  for (const stage of LIFE_STAGES) {
    player = { ...player, stage, age: LIFE_STAGE_START_AGE[stage] };
    for (let i = 0; i < perStage; i++) {

      if (!event) break;

  const model3 = multipleLinearRegression(effort.map((e, i) => [e, familySES[i], education[i]]), success);
  const model4 = multipleLinearRegression(effort.map((e, i) => [e, familySES[i], education[i], socialCapital[i]]), success);
  return [
    { key: 'model1', label: 'Model 1', formula: 'Success ~ Effort', model: model1, varLabels: ['Effort'] },
    { key: 'model2', label: 'Model 2', formula: 'Success ~ Effort + FamilySES', model: model2, varLabels: ['Effort', 'FamilySES'] },
    { key: 'model3', label: 'Model 3', formula: 'Success ~ Effort + FamilySES + Education', model: model3, varLabels: ['Effort', 'FamilySES', 'Education'] },
    { key: 'model4', label: 'Model 4', formula: 'Success ~ Effort + FamilySES + Education + SocialCapital', model: model4, varLabels: ['Effort', 'FamilySES', 'Education', 'SocialCapital'] },
  ];
}
function buildAnalysisBundle(dataset, seed, settings) {
  const wealthPercentile = percentileRank(dataset.map((d) => d.wealth));
  const datasetWithWealthPct = dataset.map((d, i) => ({ ...d, wealthPercentile: wealthPercentile[i] }));
  const successKey = (settings && settings.successOperationalization) || 'default';
  const effortKey = (settings && settings.effortOperationalization) || 'default';
  const successOp = resolveOperationalization(datasetWithWealthPct, successKey, SUCCESS_OPERATIONALIZATIONS);
  const effortOp = resolveOperationalization(datasetWithWealthPct, effortKey, EFFORT_OPERATIONALIZATIONS);
  const effort = effortOp.values;
  const success = successOp.values;
  const familySES = dataset.map((d) => d.familySES);
  const scatterData = effort.map((x, i) => ({ x, y: success[i] }));
  const model1 = simpleRegression(effort, success);
  const model2 = multipleLinearRegression(effort.map((e, i) => [e, familySES[i]]), success);
  const controlVariableModels = buildControlVariableModels(dataset, effort, success);
  const rng = createRNG(seed + '::sampleSizeDemo');
  const indices = dataset.map((_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = rng.randomInt(0, i);
    const t = indices[i]; indices[i] = indices[j]; indices[j] = t;
  }
  const sampleSize = Math.min(65, dataset.length);
  const subsetIdx = indices.slice(0, sampleSize);
  const studyAReg = simpleRegression(subsetIdx.map((i) => effort[i]), subsetIdx.map((i) => success[i]));
  const studyBReg = model1;
  /* 這一段刻意固定使用原始的六個結果變數（不隨 Success/Effort Operationalization 改變），
     因為 P-hacking／multiple testing 示範的重點是「同一份努力資料，測試多個結果變數，
     只挑顯著的來報告」，操作化選擇是另一個獨立要教的概念，兩者混在一起反而模糊教學重點。 */
  const rawEffort = dataset.map((d) => d.effort);
  const outcomes = [
    { label: '收入', key: 'income' }, { label: '財富', key: 'wealth' }, { label: '幸福', key: 'happiness' },
    { label: '職業聲望', key: 'careerPrestige' }, { label: '教育', key: 'education' }, { label: '能力（作為對照組指標）', key: 'ability' },
  ];
  const section22Tests = outcomes.map(({ label, key }) => {
    const y = dataset.map((d) => d[key]);
    const reg = simpleRegression(rawEffort, y);
    return { label, pValue: reg.pValues[0], result: reg };
  });
  return { scatterData, model1, model2, controlVariableModels, studyA: { ...studyAReg, n: sampleSize }, studyB: { ...studyBReg, n: dataset.length }, section22Tests, successOp, effortOp };
}
/* 預測結果 Preview Simulation：教師設定完成後，不進入正式遊戲，快速模擬一批 NPC
   （只用來確認「這個社會的統計結構」，不含玩家本人），呈現社會流動率、收入不平等、
   家庭背景／努力與成功的相關，以及健康與幸福的落差，並附上兩張簡易散佈圖。 */
function runPreviewSimulation(settings, sampleSize) {
  const previewSeed = 'preview::' + Math.random().toString(36).slice(2);
  const npcs = [];
  const n = sampleSize || 1000;
  for (let i = 0; i < n; i++) {
    npcs.push(simulateFullLife({ seed: previewSeed + '::npc::' + i, settings, pool: ALL_EVENTS, isNPC: true, cohortSeed: previewSeed }));
  }
  const rows = npcs.map(playerToDatasetRow);
  const familySES = rows.map((r) => r.familySES);
  const success = rows.map((r) => r.success);
  const effort = rows.map((r) => r.effort);
  const wealth = rows.map((r) => r.wealth);
  const health = rows.map((r) => r.health);
  const happiness = rows.map((r) => r.happiness);

  const familySESPct = percentileRank(familySES);
  const successPct = percentileRank(success);
  const quartileOf = (p) => Math.min(3, Math.floor(p / 25));
  let moved = 0;
  familySESPct.forEach((p, i) => { if (quartileOf(p) !== quartileOf(successPct[i])) moved += 1; });
  const mobilityRate = moved / rows.length;

  const sortedWealth = [...wealth].sort((a, b) => a - b);
  const percentileValue = (sorted, p) => sorted[Math.max(0, Math.min(sorted.length - 1, Math.floor(sorted.length * p)))];
  const p10 = percentileValue(sortedWealth, 0.1);
  const p90 = percentileValue(sortedWealth, 0.9);
  const wealthRatio = p10 > 0 ? p90 / p10 : null;

  const familySESSuccessCorr = correlation(familySES, success);
  const effortSuccessCorr = correlation(effort, success);

  const bottomIdx = familySESPct.map((p, i) => [p, i]).filter(([p]) => p < 25).map(([, i]) => i);
  const topIdx = familySESPct.map((p, i) => [p, i]).filter(([p]) => p >= 75).map(([, i]) => i);
  const avgOf = (arr, idx) => idx.length ? idx.reduce((s, i) => s + arr[i], 0) / idx.length : 0;
  const healthGap = avgOf(health, topIdx) - avgOf(health, bottomIdx);
  const happinessGap = avgOf(happiness, topIdx) - avgOf(happiness, bottomIdx);

  const scatterSampleIdx = rows.map((_, i) => i).filter((i) => i % Math.max(1, Math.ceil(rows.length / 300)) === 0);
  const scatterFamilySES = scatterSampleIdx.map((i) => ({ x: familySES[i], y: success[i] }));
  const scatterEffort = scatterSampleIdx.map((i) => ({ x: effort[i], y: success[i] }));

  return {
    sampleSize: rows.length, mobilityRate, wealthRatio,
    familySESSuccessCorr, effortSuccessCorr, healthGap, happinessGap,
    scatterFamilySES, scatterEffort,
  };
}

function ScatterChart({ data, xLabel, yLabel, regressionLine }) {
  const W = 680, H = 380, PAD_L = 62, PAD_B = 50, PAD_T = 20, PAD_R = 20;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;
  const xs = data.map((d) => d.x), ys = data.map((d) => d.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(0, Math.min(...ys)), yMax = Math.max(...ys);
  const xScale = (x) => PAD_L + ((x - xMin) / (xMax - xMin || 1)) * plotW;
  const yScale = (y) => PAD_T + plotH - ((y - yMin) / (yMax - yMin || 1)) * plotH;
  const step = Math.max(1, Math.ceil(data.length / 320));
  const sample = data.filter((_, i) => i % step === 0);
  const xTickVals = Array.from({ length: 6 }, (_, i) => xMin + (i / 5) * (xMax - xMin));
  const yTickVals = Array.from({ length: 6 }, (_, i) => yMin + (i / 5) * (yMax - yMin));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
      {yTickVals.map((v, i) => (
        <g key={'y' + i}>
          <line x1={PAD_L} x2={W - PAD_R} y1={yScale(v)} y2={yScale(v)} stroke="#2a2f3d" strokeWidth="1" />
          <text x={PAD_L - 10} y={yScale(v) + 4} textAnchor="end" fontSize="14" fill="#9296a8" fontFamily="'JetBrains Mono',monospace">{Math.round(v)}</text>
        </g>
      ))}
      {xTickVals.map((v, i) => (
        <text key={'x' + i} x={xScale(v)} y={H - PAD_B + 24} textAnchor="middle" fontSize="14" fill="#9296a8" fontFamily="'JetBrains Mono',monospace">{Math.round(v)}</text>
      ))}
      <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={H - PAD_B} stroke="#3a4152" strokeWidth="1.5" />
      <line x1={PAD_L} y1={H - PAD_B} x2={W - PAD_R} y2={H - PAD_B} stroke="#3a4152" strokeWidth="1.5" />
      {sample.map((d, i) => (<circle key={i} cx={xScale(d.x)} cy={yScale(d.y)} r={4} fill="#6fd0d0" fillOpacity="0.8" stroke="#0d0f14" strokeWidth="0.5" />))}
      {regressionLine && (
        <line
          x1={xScale(xMin)} y1={yScale(regressionLine.intercept + regressionLine.slope * xMin)}
          x2={xScale(xMax)} y2={yScale(regressionLine.intercept + regressionLine.slope * xMax)}
          stroke="#d4a84c" strokeWidth="3.5"
        />
      )}
      <text x={(PAD_L + W - PAD_R) / 2} y={H - 6} textAnchor="middle" fontSize="15" fill="#e7e8ee">{xLabel}</text>
      <text x={16} y={(PAD_T + H - PAD_B) / 2} textAnchor="middle" fontSize="15" fill="#e7e8ee" transform={`rotate(-90 16 ${(PAD_T + H - PAD_B) / 2})`}>{yLabel}</text>
    </svg>
  );
}

   自動生成頭像可以在「增加帶入感」與「不處理真人影像上傳的隱私風險」之間取得平衡。 */
function hashStringToIndex(str, mod) {
  let h = 0;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return h % mod;
}

   用骨架占位隱藏），但先鎖定 2–3 秒無法點擊，避免玩家還沒看完題目就直覺搶答。
   用在後段「社會科學解密」的互動題目（選擇題、散佈圖猜測、p-hacking 小遊戲等）。 */
function useAnswerDelay(depKey) {
  const pauseMs = useMemo(() => READING_PAUSE_MIN_MS + Math.random() * (READING_PAUSE_MAX_MS - READING_PAUSE_MIN_MS), [depKey]);
  const [locked, setLocked] = useState(true);
  const [secondsLeft, setSecondsLeft] = useState(Math.ceil(pauseMs / 1000));
  useEffect(() => {
    setLocked(true);
    setSecondsLeft(Math.ceil(pauseMs / 1000));
    const tickId = setInterval(() => setSecondsLeft((s) => Math.max(0, s - 1)), 1000);
    const unlockId = setTimeout(() => { setLocked(false); clearInterval(tickId); }, pauseMs);
    return () => { clearInterval(tickId); clearTimeout(unlockId); };
  }, [depKey, pauseMs]);
  return { locked, secondsLeft };
}
function AnswerDelayNotice({ locked, secondsLeft }) {
  return (
    <div className={'text-sm font-mono transition-opacity duration-300 ' + (locked ? 'opacity-100 text-brass mb-3' : 'opacity-0 h-0 overflow-hidden')} aria-live="polite">
      請先讀完題目再作答 · {secondsLeft > 0 ? secondsLeft + ' 秒後開放作答' : '即將開放'}
    </div>
  );
}

const ATTRIBUTION_LABELS = [
  { key: 'effort', label: '努力' }, { key: 'ability', label: '能力' }, { key: 'family', label: '家庭' },
  { key: 'education', label: '教育' }, { key: 'network', label: '人脈' }, { key: 'institution', label: '社會制度' }, { key: 'luck', label: '運氣' },
];
function makeEvenAttribution() {
  const EVEN = Math.floor(100 / ATTRIBUTION_LABELS.length);
  const base = {};
  ATTRIBUTION_LABELS.forEach(({ key }) => { base[key] = EVEN; });
  base.effort += 100 - EVEN * ATTRIBUTION_LABELS.length;
  return base;
}

function AttributionComparisonRow({ label, note, selfValue, actualValue, weight }) {
  const diff = Math.round(selfValue) - Math.round(actualValue);
  const diffAbs = Math.abs(diff);
  const diffLabel = diff > 4 ? ('你高估了約 ' + diffAbs + ' 分') : diff < -4 ? ('你低估了約 ' + diffAbs + ' 分') : '你的直覺跟模擬結果相當接近';
  const diffColor = diff > 4 ? 'text-rust' : diff < -4 ? 'text-teal' : 'text-sage';
  return (
    <div className="border-b border-borderc pb-4 mb-4 last:border-0 last:pb-0 last:mb-0">
      <div className="flex items-baseline justify-between gap-3 mb-2">
        <span className="text-ink font-medium text-sm">{label}</span>

function GameScreen({ player, playerName, nextEvent, phase, settings, choose, goToAttribution, submitAttribution, goToAnalysis }) {
  const [lastNarrative, setLastNarrative] = useState(null);
  const lastEventIdRef = useRef(null);
  const [blindGuess, setBlindGuess] = useState(null);
  const [blindGuessSubmitted, setBlindGuessSubmitted] = useState(false);

  const handleChoose = (choiceId) => {
    lastEventIdRef.current = nextEvent.id;
    choose(choiceId);
  };

  useEffect(() => {
    if (!player) return;
    const last = player.history[player.history.length - 1];
    if (last && last.eventId === lastEventIdRef.current) {
      setLastNarrative(last.narrative || null);
    }
  }, [player]);

  if (!player) return null;

const STEP_ORDER = [
  'intro', 'scatterGuess', 'h0Intro', 'pValueReveal', 'pValueQuiz', 'pValueTrap',
  'addFamilyModel', 'controlVariables', 'sampleSizeTrap', 'effectSize', 'multipleTestingGame', 'twentyTests',
  'license', 'backToLife', 'finalQuestions', 'finalScreen',
];

function fmtP(p) { return p < 0.001 ? '< .001' : p.toFixed(3); }

function TwentyTestsStep({ seed, onContinue }) {
  const rng = useMemo(() => createRNG(seed + '::twentyTests'), [seed]);
  const results = useMemo(() => simulateMultipleTests(Array.from({ length: 20 }, (_, i) => '檢定 ' + (i + 1)), 0.05, rng.random), [rng]);
  const fwer = familyWiseErrorRate(0.05, 20);
  const anySignificant = results.some((r) => r.significant);
  return (
    <Panel eyebrow="社會科學解密 · Multiple Testing">
      <h2 className="font-display text-lg text-ink mb-2">20 次檢定</h2>
      <p className="text-sm text-inkFaint mb-4">如果每一次 α = .05，且進行 20 個相互獨立的檢定（H₀ 全部成立），至少一次 false positive 的機率約為 <span className="text-brass font-mono">{(fwer * 100).toFixed(1)}%</span>。</p>
      <div className="grid grid-cols-5 gap-2 mb-4">
        {results.map((r, i) => (
          <div key={i} className={'text-center py-2 rounded-lg text-xs font-mono border ' + (r.significant ? 'bg-brass/15 border-brass text-brass' : 'bg-surface2 border-borderc text-inkFaint')}>
            {r.pValue.toFixed(2)}
          </div>
        ))}
      </div>
      <p className="text-sm text-inkFaint mb-2">{anySignificant ? '你會發現：即使 H₀ 全部成立，這一輪模擬中仍然「抽到」了看似顯著的星星。' : '這一輪剛好沒有抽到顯著結果，但公式告訴我們，長期而言仍有相當高的機率至少中一次。'}</p>
      <ContinueButton onClick={onContinue} />
    </Panel>
  );
}

                <StatBox label="Effort p 值" value={fmtP(bundle.model2.pValues[0])} />
                <StatBox label="Family SES β" value={bundle.model2.coefficients[1].toFixed(3)} />
                <StatBox label="Family SES p 值" value={fmtP(bundle.model2.pValues[1])} />
              </div>
            </div>
          </div>
          <p className="text-sm text-inkDim mb-2">努力突然「沒有用了」嗎？</p>
          <p className="text-sm text-inkFaint">不是。兩個模型問的問題不同：Model 1 問「努力與成功是否存在整體關聯？」，Model 2 問「在家庭 SES 相同的條件下，努力與成功還有多少關聯？」這牽涉到 confounding（混淆變數）、omitted variable（遺漏變數）與 controls（控制變數）等概念。</p>
          <ContinueButton onClick={next} />
        </Panel>
      )}

      {step === 'controlVariables' && (() => {
        const models = bundle.controlVariableModels;
        const effortAcrossModels = models.map((m) => m.model.coefficients[0]);
        const firstBeta = effortAcrossModels[0];
        const lastBeta = effortAcrossModels[effortAcrossModels.length - 1];
        const shrinkPct = firstBeta !== 0 ? Math.round((1 - lastBeta / firstBeta) * 100) : 0;
        return (
          <Panel eyebrow="社會科學解密 · 控制變數實驗">
            <h2 className="font-display text-lg text-ink mb-2">逐步加入控制變數</h2>
            <p className="text-sm text-inkFaint mb-4">每一個模型都多控制一個變數，同樣觀察「努力（Effort）」的係數與顯著性怎麼變化——這是 confounding（混淆變數）與 omitted variable bias（遺漏變數偏誤）最直接的示範。</p>
            <div className="space-y-4 mb-4">
              {models.map((m, idx) => {
                const effortCoef = m.model.coefficients[0];
                const effortSE = m.model.standardErrors[0];
                const effortP = m.model.pValues[0];
                const effortCI = m.model.confidenceIntervals[0];
                return (
                  <div key={m.key} className="rounded-lg bg-surface2 border border-borderc p-3">
                    <div className="text-xs text-inkFaint mb-2 font-mono">{m.label}：{m.formula}</div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <StatBox label="Effort β" value={effortCoef.toFixed(3)} />
                      <StatBox label="Effort SE" value={effortSE.toFixed(3)} />
                      <StatBox label="Effort p 值" value={fmtP(effortP)} />
                      <StatBox label="Effort 95% CI" value={'[' + effortCI[0].toFixed(2) + ', ' + effortCI[1].toFixed(2) + ']'} />
                    </div>
                    <div className="grid grid-cols-1">
                      <StatBox label="模型 R²" value={m.model.r2.toFixed(3)} />
                    </div>
                    {idx > 0 && (
                      <p className="text-xs text-inkFaint mt-2">相較於前一個模型，Effort β 從 {effortAcrossModels[idx - 1].toFixed(3)} 變為 {effortCoef.toFixed(3)}——差異來自新加入的控制變數吸收了一部分原本歸給努力的解釋力。</p>
                    )}
                  </div>
                );
              })}
            </div>
            <p className="text-sm text-inkDim mb-2">從 Model 1 到 Model 4，Effort 的係數整體下降了約 {Math.max(0, shrinkPct)}%。</p>
            <p className="text-sm text-inkFaint">這不代表「努力沒有用」，而是 Model 1 把家庭背景、教育、社會資本透過努力間接產生的效果，也算進了努力的係數裡。控制變數愈多，係數愈接近「排除這些因素之後，努力本身還剩下多少獨立解釋力」——但這也不代表控制變數愈多愈好：加入跟結果無關、或本身就是努力之後果的變數，反而會製造新的偏誤（over-control bias）。</p>
            <ContinueButton onClick={next} />
          </Panel>
        );
      })()}

      {step === 'sampleSizeTrap' && (
        <Panel eyebrow="社會科學解密 · 樣本數陷阱">
          <h2 className="font-display text-lg text-ink mb-4">只看 P 值的陷阱：樣本數</h2>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="rounded-lg bg-surface2 border border-borderc p-3">
              <div className="text-xs text-inkFaint mb-2 font-mono">Study A（小樣本，N = {bundle.studyA.n}）</div>
              <StatBox label="β" value={bundle.studyA.coefficients[0].toFixed(3)} />
              <div className="h-2" />
              <StatBox label="p 值" value={fmtP(bundle.studyA.pValues[0])} />
            </div>
            <div className="rounded-lg bg-surface2 border border-borderc p-3">
              <div className="text-xs text-inkFaint mb-2 font-mono">Study B（大樣本，N = {bundle.studyB.n}）</div>
              <StatBox label="β" value={bundle.studyB.coefficients[0].toFixed(3)} />
              <div className="h-2" />
              <StatBox label="p 值" value={fmtP(bundle.studyB.pValues[0])} />
            </div>
          </div>
          <p className="text-sm text-inkDim mb-2">哪一個效果比較重要？</p>
          <p className="text-sm text-inkFaint">不要只依照星號（p 值）回答。Statistical significance ≠ Substantive significance。p 值同時受到 effect size、sample size 與 uncertainty 共同影響 — 樣本數越大，越小的效果也可能達到統計顯著。</p>
          <ContinueButton onClick={next} />
        </Panel>
      )}

      {step === 'effectSize' && (
        <Panel eyebrow="社會科學解密 · Effect Size">
          <h2 className="font-display text-lg text-ink mb-4">不只問「顯不顯著？」，也要問「有多大？」</h2>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <StatBox label="β" value={beta1.toFixed(3)} />
            <StatBox label="95% CI" value={'[' + bundle.model1.confidenceIntervals[0][0].toFixed(2) + ', ' + bundle.model1.confidenceIntervals[0][1].toFixed(2) + ']'} />
            <StatBox label="p" value={fmtP(p1)} />
            <StatBox label="N" value={String(npcDataset.length)} />
          </div>
          <p className="text-sm text-inkFaint">一份好的研究結果，至少應該一起閱讀係數大小（effect size）、信賴區間（不確定性）、p 值與樣本數這四項資訊。</p>
          <ContinueButton onClick={next} />
        </Panel>
      )}

      {step === 'multipleTestingGame' && (() => {
        const anySig = bundle.section22Tests.some((t) => t.pValue < 0.05);
        return (
          <Panel eyebrow="社會科學解密 · p-Hacking 小遊戲">
            <h2 className="font-display text-lg text-ink mb-2">努力沒有顯著？再試幾個人生結果看看。</h2>
            <p className="text-sm text-inkFaint mb-4">把「努力」分別拿去跟以下幾個結果變數做迴歸：</p>
            <div className="space-y-2 mb-4">
              {bundle.section22Tests.map((t) => {
                const sig = t.pValue < 0.05;
                return (
                  <div key={t.label} className={'flex items-center justify-between px-4 py-2.5 rounded-lg border ' + (sig ? 'border-brass bg-brass/10' : 'border-borderc bg-surface2')}>
                    <span className="text-ink text-sm">{t.label}</span>
                    <span className={'text-sm font-mono ' + (sig ? 'text-brass' : 'text-inkFaint')}>p = {t.pValue.toFixed(3)} {sig ? '（顯著）' : ''}</span>
                  </div>
                );
              })}
            </div>
            {anySig ? (
              <React.Fragment>
                <p className="text-sm text-sage mb-4">找到了！p &lt; .05</p>
                <p className="text-sm text-inkDim mb-3">要不要只報告這個顯著的結果？</p>
                <div className="flex gap-3 mb-1">
                  <button disabled={stepLocked} aria-disabled={stepLocked} onClick={() => { setReportOnlySignificant(true); setStep('multipleTestingWarningYes'); }}
                    className={'btn-ghost px-4 py-2 text-sm transition-opacity duration-300 ' + (stepLocked ? 'opacity-40 cursor-not-allowed' : 'opacity-100')}>要</button>
                  <button disabled={stepLocked} aria-disabled={stepLocked} onClick={() => { setReportOnlySignificant(false); setStep('multipleTestingWarningNo'); }}
                    className={'btn-ghost px-4 py-2 text-sm transition-opacity duration-300 ' + (stepLocked ? 'opacity-40 cursor-not-allowed' : 'opacity-100')}>不要</button>
                </div>
                <AnswerDelayNotice locked={stepLocked} secondsLeft={stepSecondsLeft} />
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="text-sm text-inkDim mb-4">這一輪剛好沒有任何結果跨過 p &lt; .05 的門檻 — 現實研究本來就不保證每次都能找到「顯著」的結果。</p>
                <ContinueButton onClick={() => setStep('twentyTests')} />
              </React.Fragment>
            )}
          </Panel>
        );
      })()}

      {(step === 'multipleTestingWarningYes' || step === 'multipleTestingWarningNo') && (
        <Panel eyebrow="社會科學解密 · 研究倫理">
          {reportOnlySignificant ? (
            <React.Fragment>
              <p className="text-xl font-display text-ink mb-2">Paper Accepted</p>
              <p className="text-sm text-rust font-medium mb-4">Research Integrity Warning</p>
            </React.Fragment>
          ) : (
            <p className="text-sm text-sage font-medium mb-4">好選擇 — 誠實報告所有檢定結果，是避免以下問題的第一步：</p>
          )}
          <ul className="text-sm text-inkDim space-y-2 mb-4 list-disc list-inside">
            <li>Multiple testing（多重檢定）：測試的變數越多，出現「假顯著」的機會就越高。</li>
            <li>Cherry-picking（挑選結果）：只報告顯著的那一個，會誤導讀者。</li>
            <li>P-hacking：為了得到顯著結果而不斷嘗試不同的變數或模型設定。</li>
            <li>Publication bias（發表偏誤）：顯著的結果比較容易被發表，形成系統性偏差。</li>
          </ul>
          <ContinueButton onClick={() => setStep('twentyTests')} />
        </Panel>
      )}

      {step === 'twentyTests' && <TwentyTestsStep seed={seed} onContinue={next} />}

      {step === 'license' && (
        <Panel eyebrow="社會科學解密 · 結業">
          <h2 className="font-display text-xl text-ink mb-4">P-VALUE LICENSE</h2>
          <p className="text-sm text-inkDim mb-4">你現在知道：</p>
          <ul className="text-sm text-ink space-y-2 mb-6">
            {['p < .05 不代表 H₀ 為假的機率是 95%', 'p < .05 不代表效果很大', 'p > .05 不代表「完全沒有效果」', '大樣本可能讓很小的效果顯著', '多重檢定增加 false positive 風險', '不同模型回答不同問題', '相關不等於因果', '不應只報告有星號的結果'].map((item) => (
              <li key={item} className="flex gap-2"><span className="text-sage">✓</span><span>{item}</span></li>
            ))}
          </ul>
          <div className="text-sm text-inkFaint space-y-1 border-t border-borderc pt-4">
            <p className="text-ink mb-2">不要只問：「有沒有顯著？」而要問：</p>
            <p>效果有多大？ 不確定性有多高？ 樣本有多少？</p>
            <p>模型控制了什麼？ 是否存在其他合理解釋？ 研究設計允許我們做多強的結論？</p>
          </div>
          <ContinueButton onClick={next} />
        </Panel>
      )}

      {step === 'backToLife' && (
        <Panel eyebrow="回到人生">
          <h2 className="font-display text-lg text-ink mb-1">回到人生</h2>
          <p className="text-sm text-inkFaint mb-4">下面每一列都是同一個因素：上排「你認為」是你剛才自己給的估計，下排「實際」是模擬引擎在背後真正使用的數值，右上角則是這個因素在目前前提下的加權（β）。</p>
          <PremiseNotice settings={settings} compact />
          {selfAttribution && (
            <div className="mt-2">
              {ATTRIBUTION_ACTUAL_MODEL.map((row) => (
                <AttributionComparisonRow key={row.key} label={row.label} note={row.note}
                  selfValue={selfAttribution[row.key] || 0}
                  actualValue={row.getValue(player)}
                  weight={row.getWeight(settings)} />
              ))}
            </div>
          )}
          <p className="text-sm text-inkFaint mt-2">這不是在告訴你「人生可以精確分成幾個百分比」，而是在展示人生結果可能由多種因素共同形成；換一種前提（見上方提醒），同一組人生選擇也會對應到完全不同的加權結果。</p>
          <ContinueButton onClick={next} />
        </Panel>
      )}

      {step === 'finalQuestions' && (
        <Panel eyebrow="小結">
          <div className="space-y-6 text-center">
            <div><p className="text-lg text-ink mb-2">努力有沒有用？</p><span className="inline-block px-4 py-1.5 rounded-full bg-sage/15 border border-sage text-sage text-sm">有</span></div>
            <div><p className="text-lg text-ink mb-2">努力一定會成功嗎？</p><span className="inline-block px-4 py-1.5 rounded-full bg-surface2 border border-borderc text-ink text-sm">不一定</span></div>
            <div><p className="text-lg text-ink mb-2">家庭背景是不是決定一切？</p><span className="inline-block px-4 py-1.5 rounded-full bg-surface2 border border-borderc text-ink text-sm">也不是</span></div>
          </div>
          <div className="text-center mt-8 text-inkDim text-sm space-y-1">
            <p>努力可以改變成功的機率。</p>
            <p>但每個人的起點、資源、阻力與機會並不相同。</p>
          </div>
          <ContinueButton onClick={next} label="查看最後畫面" />
        </Panel>
      )}

      {step === 'finalScreen' && (
        <FinalScreen
          onRestart={() => { resetGame(); onDone(); }}
          onSameSeed={() => { startNewGame(seed); }}
          onNewLife={() => { startNewGame(); }}
        />
      )}
    </div>
  );
}

/* ============================================================
   13. APP ROOT — state machine + localStorage persistence
   ============================================================ */
const SAVE_KEY = 'life-momentum-save-v1';
const DISCLAIMER_KEY = 'life-momentum-disclaimer-ack-v1';
function loadDisclaimerAck() {
  try { return window.localStorage.getItem(DISCLAIMER_KEY) === '1'; } catch (e) { return false; }
}
function writeDisclaimerAck() {
  try { window.localStorage.setItem(DISCLAIMER_KEY, '1'); } catch (e) { /* ignore */ }
}

/* 電腦／手機通用版：不提供手動切換，完全依螢幕寬度用 CSS 響應式呈現。
   統一採用「直立式遊戲畫框」：手機版滿版鋪滿螢幕（用 100dvh，避免網址列造成高度誤差）；
   桌機／平板版則把畫面收在置中的直式長方形畫框內，模擬手機遊戲的直式比例與邊框質感。
   畫框內部可獨立捲動，搭配前面針對 <640px / <480px 的字級放大媒體查詢一起使用。 */
function ResponsiveShell({ children }) {
  return (
    <div className="game-backdrop">
      <div className="game-frame">
        <div className="game-frame-scroll">
          {children}
        </div>
      </div>
    </div>
  );
}

function loadSave() {
  try {
    const raw = window.localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch (e) { return null; }
}
function writeSave(data) {
  try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
}
function randomSeed() {
  return Math.random().toString(36).slice(2, 10);
}

function App() {
  const [disclaimerAcked, setDisclaimerAcked] = useState(() => loadDisclaimerAck());
  const initial = useMemo(() => loadSave(), []);
  const [seed, setSeed] = useState(initial && initial.seed ? initial.seed : null);
  const [history, setHistory] = useState(initial && Array.isArray(initial.history) ? initial.history : []);
  const [settings, setSettings] = useState(initial && initial.settings ? clampSettings(initial.settings) : DEFAULT_SETTINGS);
  const [phase, setPhase] = useState(initial && initial.phase ? initial.phase : 'home');
  const [selfAttribution, setSelfAttribution] = useState(initial ? initial.selfAttribution || null : null);
  const [rebornConfidence, setRebornConfidence] = useState(initial ? initial.rebornConfidence || null : null);
  const [npcDataset, setNpcDataset] = useState(null);
  const [playerName, setPlayerName] = useState(initial && typeof initial.playerName === 'string' ? initial.playerName : '');

  useEffect(() => {
    writeSave({ seed, history, settings, phase, selfAttribution, rebornConfidence, playerName });
  }, [seed, history, settings, phase, selfAttribution, rebornConfidence, playerName]);

  const session = useMemo(() => {
    if (!seed) return { player: null, nextEvent: null, done: false };
    return replaySession(seed, settings, ALL_EVENTS, history);
  }, [seed, history, settings]);

  useEffect(() => {
    if (phase === 'analysis' && !npcDataset && session.player) {
      const t = setTimeout(() => {
        const { rows } = generateNPCDataset(seed, session.player, ALL_EVENTS, settings);
        setNpcDataset(rows);
      }, 30);
      return () => clearTimeout(t);
    }
  }, [phase, npcDataset, session.player, seed, settings]);

  const startNewGame = useCallback((seedInput, nameInput) => {
    const s = seedInput && seedInput.trim().length > 0 ? seedInput.trim() : randomSeed();
    setSeed(s);
    setHistory([]);
    setPhase('playing');
    setSelfAttribution(null);
    setRebornConfidence(null);
    setNpcDataset(null);
    if (typeof nameInput === 'string') setPlayerName(nameInput.trim().slice(0, 12));
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('seed', s);
      window.history.replaceState({}, '', url.toString());
    } catch (e) { /* ignore */ }
  }, []);

  const continueGame = useCallback(() => {
    if (!seed || history.length === 0) return false;
    setPhase(session.nextEvent ? 'playing' : 'ending');
    return true;
  }, [seed, history, session.nextEvent]);

  const choose = useCallback((choiceId) => {
    if (!session.nextEvent) return;
    const newHistory = [...history, { eventId: session.nextEvent.id, choiceId }];
    setHistory(newHistory);
    const nextSession = replaySession(seed, settings, ALL_EVENTS, newHistory);
    if (!nextSession.nextEvent) setPhase('ending');
  }, [session.nextEvent, history, seed, settings]);

  const goToAttribution = useCallback(() => setPhase('attribution'), []);
  const submitAttribution = useCallback((attribution, confidence) => {
    setSelfAttribution(attribution);
    setRebornConfidence(confidence);
    setPhase('reveal');
  }, []);
  const goToAnalysis = useCallback(() => setPhase('analysis'), []);

  const updateSettings = useCallback((partial) => {
    setSettings((prev) => clampSettings({ ...prev, ...partial }));
    setNpcDataset(null);
  }, []);
  const applyPreset = useCallback((presetKey) => {
    setSettings((prev) => clampSettings({ ...prev, ...PRESETS[presetKey].settings }));
    setNpcDataset(null);
  }, []);
  const resetSettingsToDefault = useCallback(() => { setSettings(DEFAULT_SETTINGS); setNpcDataset(null); }, []);

  const resetGame = useCallback(() => {
    setSeed(null);
    setHistory([]);
    setPhase('home');
    setSelfAttribution(null);
    setRebornConfidence(null);
    setNpcDataset(null);
    setPlayerName('');
  }, []);

  const hasSave = !!seed && history.length > 0;

  if (!disclaimerAcked) {
    return <DisclaimerScreen onAck={() => { writeDisclaimerAck(); setDisclaimerAcked(true); }} />;
  }

  let content;
  if (phase === 'home') {
    content = <HomeScreen onStart={startNewGame} onContinue={continueGame} hasSave={hasSave} onShowHowTo={() => setPhase('howto')} onShowTeacher={() => setPhase('teacher')} />;
  } else if (phase === 'howto') {
    content = <HowToScreen onBack={() => setPhase('home')} />;
  } else if (phase === 'teacher') {
    content = <TeacherScreen settings={settings} updateSettings={updateSettings} applyPreset={applyPreset} resetSettingsToDefault={resetSettingsToDefault} onBack={() => setPhase('home')} onStartExperiment={startNewGame} />;
  } else if (phase === 'analysis') {
    content = (
      <AnalysisScreen
        seed={seed} player={session.player} npcDataset={npcDataset} selfAttribution={selfAttribution} settings={settings}
        resetGame={resetGame} startNewGame={startNewGame} onDone={() => {}}
      />
    );
  } else {
    content = (
      <GameScreen
        player={session.player} playerName={playerName} nextEvent={session.nextEvent} phase={phase} settings={settings}
        choose={choose} goToAttribution={goToAttribution} submitAttribution={submitAttribution} goToAnalysis={goToAnalysis}
      />
    );
  }

  return <ResponsiveShell>{content}</ResponsiveShell>;
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
